name: osint-postgres
image: postgres:16
container_name: osint-postgres
restart: unless-stopped
environment:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: osint
ports:
  - "5432:5432"
volumes:
  - pgdata:/var/lib/postgresql/data
healthcheck:
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 10s
  timeout: 5s
  retries: 5

volumes:
  pgdata:
